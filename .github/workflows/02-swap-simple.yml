name: "02 · Simple Swap (CPU, single job)"

on:
  workflow_dispatch:
    inputs:
      target_video_url:
        description: "Direct URL of the video whose subject gets replaced"
        required: true
        default: "https://github.com/facefusion/facefusion-assets/releases/download/examples-3.0.0/target-540p.mp4"
      source_face_url:
        description: "Direct URL of the NEW face reference image (jpg/png)"
        required: true
        default: "https://github.com/facefusion/facefusion-assets/releases/download/examples-3.0.0/source.jpg"
      face_selector_order:
        description: "How subjects in the video are ordered/selected"
        required: false
        default: "left-right"
        type: choice
        options: [ "left-right", "right-left", "top-bottom", "bottom-top", "small-large", "large-small", "best", "all" ]
      reference_face_position:
        description: "0-based index of the subject to replace (1 = second subject)"
        required: false
        default: "0"
      reference_frame_number:
        description: "Frame number used to lock the reference subject"
        required: false
        default: "0"
      swapper_model:
        description: "Face swapper model"
        required: false
        default: "inswapper_128"
        type: choice
        options: [ "inswapper_128", "hyperswap_1a_256", "hyperswap_1b_256", "hyperswap_1c_256", "simswap_unofficial_512", "ghost_3_256", "blendswap_256", "uniface_256" ]
      pixel_boost:
        description: "Pixel boost resolution for the swapped face"
        required: false
        default: "256x256"
        type: choice
        options: [ "128x128", "256x256", "384x384", "512x512", "768x768", "1024x1024" ]
      use_face_enhancer:
        description: "Add GFPGAN 1.4 face enhancer post-pass"
        required: false
        default: "true"
        type: choice
        options: [ "true", "false" ]
      face_mask_types:
        description: "Face mask types (space separated)"
        required: false
        default: "box occlusion"
      execution_thread_count:
        description: "ONNX threads on the 4-vCPU runner (2 is a good default)"
        required: false
        default: "2"
      output_video_quality:
        description: "Output video quality (0-100)"
        required: false
        default: "85"
      facefusion_ref:
        description: "FaceFusion git ref to install"
        required: false
        default: "master"
      extra_args:
        description: "Extra raw CLI args appended to headless-run (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  swap:
    name: swap (ubuntu-latest, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Set up FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone FaceFusion (${{ inputs.facefusion_ref }})
        run: |
          git clone --depth 1 https://github.com/facefusion/facefusion.git "$GITHUB_WORKSPACE/facefusion" --branch "${{ inputs.facefusion_ref }}" || \
          git clone --depth 1 https://github.com/facefusion/facefusion.git "$GITHUB_WORKSPACE/facefusion"

      - name: Cache FaceFusion models
        uses: actions/cache@v4
        with:
          path: facefusion/.assets/models
          key: facefusion-models-${{ runner.os }}-${{ inputs.facefusion_ref }}

      - name: Install FaceFusion (CPU onnxruntime)
        working-directory: facefusion
        run: python install.py default --skip-conda

      - name: Download media
        run: |
          curl -L --retry 5 --retry-delay 3 -o target.mp4  "${{ inputs.target_video_url }}"
          curl -L --retry 5 --retry-delay 3 -o source.img "${{ inputs.source_face_url }}"
          file target.mp4 source.img
          echo "### Input media" >> "$GITHUB_STEP_SUMMARY"
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 target.mp4 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Run swap (CPU)
        working-directory: facefusion
        run: |
          PROCESSORS="face_swapper"
          if [ "${{ inputs.use_face_enhancer }}" = "true" ]; then
            PROCESSORS="face_swapper face_enhancer"
          fi
          python facefusion.py headless-run \
            --log-level info \
            --processors $PROCESSORS \
            --face-swapper-model "${{ inputs.swapper_model }}" \
            --face-swapper-pixel-boost "${{ inputs.pixel_boost }}" \
            --face-mask-types ${{ inputs.face_mask_types }} \
            --face-selector-order "${{ inputs.face_selector_order }}" \
            --reference-face-position "${{ inputs.reference_face_position }}" \
            --reference-frame-number "${{ inputs.reference_frame_number }}" \
            --execution-providers cpu \
            --execution-thread-count "${{ inputs.execution_thread_count }}" \
            --output-video-encoder libx264 \
            --output-video-preset veryfast \
            --output-video-quality "${{ inputs.output_video_quality }}" \
            -s ../source.img \
            -t ../target.mp4 \
            -o ../output.mp4 \
            ${{ inputs.extra_args }}

      - name: Build before/after contact sheet
        run: |
          pip install --quiet pillow
          python scripts/make_contact_sheet.py \
            --before target.mp4 --after output.mp4 \
            --out contact_sheet.png --frames 6

      - name: 4-round offline critique
        run: |
          pip install --quiet numpy opencv-python-headless
          python scripts/offline_critique.py \
            --before target.mp4 --after output.mp4 \
            --out-md critique_report.md --out-json critique_report.json
          cat critique_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Optional 4-round VLM critique (needs repo secrets)
        if: ${{ secrets.VLM_API_KEY != '' }}
        env:
          VLM_API_BASE: ${{ secrets.VLM_API_BASE }}
          VLM_API_KEY: ${{ secrets.VLM_API_KEY }}
          VLM_MODEL: ${{ secrets.VLM_MODEL }}
        run: |
          pip install --quiet requests
          python scripts/vlm_critique.py \
            --before target.mp4 --after output.mp4 \
            --out-md vlm_report.md || true
          if [ -f vlm_report.md ]; then cat vlm_report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: swap-output
          path: |
            output.mp4
            contact_sheet.png
            critique_report.md
            critique_report.json
          retention-days: 90
